        .row{
            width:370px;

        }

        .input-form-control {
            display: block;
            width: 45%;
            height: calc(1.5em + .75rem + 2px);
            padding: .375rem .75rem;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: #495057;
            background-color: #fff;
            background-clip: padding-box;
            border: 1px solid #ced4da;
            border-radius: .25rem;
            transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
        }

        .custom-input {
            position: relative;
            padding-top: 2px;
/*            margin-bottom: 5px;*/
            display: flex;
            justify-content: space-around;
        }

            .custom-input input {
                padding-left: 15px;
            }

            .custom-input label {
                cursor: text;
                margin: 0;
                padding: 0;
                left: 15px;
                top: 23px;
                position: absolute;
                font-size: 14px;
                color: #ccc;
                font-weight: normal;
                transition: all .3s ease;
            }

                .custom-input label.active {
                    top: 0;
                    left: 0;
                    font-size: 12px;
                }

                    .custom-input label.active.focusIn {
                        color: #66afe9;
                    }
        .span_font {
            font-weight: bold;
            color: var(--heading-color);
            font-family: "Calibri";
        }

        button {
            display: block;
            position: relative;
            top: 0;
            border: 0;
            color: white;
            border-radius: 2rem;
            line-height: 1;
            /*font-size: 20px;*/
            padding: 5px 25px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            width: 30%;
            font-family: "Calibri";
        }

            button.red {
                background: linear-gradient(-45deg, #fb2222 50%, #920a0a 60%, #d42e2e 70%);
            }

            button.blue {
                background: linear-gradient(-45deg, #2284fb 50%, #0a0e92 60%, #2e59d4 70%);
            }

            button.yellow {
                background: linear-gradient(-45deg, #f9d154 50%, #ffc107 60%, #edc33e 70%);
            }
            button.shiny {
                background-size: 600% 100%;
                /*-webkit-animation: shine 20s infinite;*/
                animation: shine 20s infinite;
                /*-webkit-animation-delay: 0s;*/
                animation-delay: 0s;
                /*-webkit-animation-timing-function: linear;*/
                animation-timing-function: linear;
            }

            button:active {
                top: 2px;
            }

        <script>
            function NozViewUpdate(OldNozID, NozID, GradeName, TankName, Amount, Volume, AmountTotal, VolumeTotal, Price, isRun, isControl, Auth,AuthStatue) {
                //alert(OldNozID);
                try {
                    if (GradeName != "-1")
                        $("#GradeName" + OldNozID).html(GradeName);
                    if (TankName != "-1")
                        $("#TankID" + OldNozID).html(TankName);
                    if (Amount != "-1")
                        $("#Amount" + OldNozID).html(Amount);
                    if (Volume != "-1")
                        $("#Volume" + OldNozID).html(Volume);
                    if (AmountTotal != "-1")
                        $("#AmountTotal" + OldNozID).html(AmountTotal);
                    if (VolumeTotal != "-1")
                        $("#VolumeTotal" + OldNozID).html(VolumeTotal);
                    if (Price != "-1")
                        $("#Price" + OldNozID + "").html(Price);

                    if (isControl != "-1") {
                        if (isControl == "0") {
                            $("#ControlText" + OldNozID).html("Autonome");
                            $("#ControlValue" + OldNozID).attr("checked", false);
                        }
                        else {
                            $("#ControlText" + OldNozID).html("Contrôlé");
                            $("#ControlValue" + OldNozID).attr("checked", true)
                        }
                    }

                    if (isRun != "-1") {
                        if (isRun == "0")
                            $("#Fuel" + OldNozID).attr('src', "image/Online.png");
                        else if (isRun == "1")
                            $("#Fuel" + OldNozID).attr('src', "image/Fuel.png");
                        else if (isRun == "3")
                            $("#Fuel" + OldNozID).attr('src', "image/Fueling.gif");
                        else if (isRun == "4")
                            $("#Fuel" + OldNozID).attr('src', "image/offline.png");
                    } else {
                        //$("#Fuel" + OldNozID).attr('src', "image/offline.png");
                    }

                    //$("#Auth" + OldNozID).hide();
                    //if (Auth == "1") {
                    //    $("#Auth" + OldNozID).html("已授权");
                    //    $("#Auth" + OldNozID).show();
                    //}

                    if (Auth!="-1")
                        $("#Auth" + OldNozID).html(Auth);

                    if (AuthStatue != "-1")
                        $("#AuthStatue" + OldNozID).html(AuthStatue);

                    if (NozID != "-1") {
                        $("#NozID" + OldNozID).html("" + NozID + "");

                        $("#row" + OldNozID).attr("id", "row" + NozID + "");
                        $("#Fuel" + OldNozID).attr("id", "Fuel" + NozID + "");
                        $("#NozID" + OldNozID).attr("id", "NozID" + NozID + "");
                        $("#GradeName" + OldNozID).attr("id", "GradeName" + NozID + "");
                        $("#Amount" + OldNozID).attr("id", "Amount" + NozID + "");
                        $("#Volume" + OldNozID).attr("id", "Volume" + NozID + "");
                        $("#TankID" + OldNozID).attr("id", "TankID" + NozID + "");
                        $("#ControlText" + OldNozID).attr("id", "ControlText" + NozID + "");
                        $("#ControlValue" + OldNozID).attr("id", "ControlValue" + NozID + "");
                        $("#AmountTotal" + OldNozID).attr("id", "AmountTotal" + NozID + "");
                        $("#VolumeTotal" + OldNozID).attr("id", "VolumeTotal" + NozID + "");
                        $("#Price" + OldNozID).attr("id", "Price" + NozID + "");
                        $("#Pre" + OldNozID + "").attr("id", "Pre" + NozID + "");
                        $("#Sta" + OldNozID + "").attr("id", "Sta" + NozID + "");
                        $("#Sto" + OldNozID + "").attr("id", "Sto" + NozID + "");
                        $("#Upd" + OldNozID + "").attr("id", "Upd" + NozID + "");
                        $("#NozID" + OldNozID + "").attr("id", "NozID" + NozID + "");
                    }
                } catch (e) {

        function NozUpdate(NozID, GradeName, Amount, Volume, TankID, AmountTotal, VolumeTotal, Price, isRun,IsControl) {
            if (NozID.indexOf("-") == -1)
                $("#NozID").html(NozID);
            if (GradeName != "-1")
                $("#GradeName").html(GradeName);
            if (Amount.indexOf("-") == -1)
                $("#Amount").html(Amount);

                $("#Volume").html(Volume);
            if (TankID != -1)
                $("#TankID").html(TankID);
            if (AmountTotal.indexOf("-") == -1)
                $("#AmountTotal").html(AmountTotal);
            if (VolumeTotal.indexOf("-") == -1)
                $("#VolumeTotal").html(VolumeTotal);
            if (Price.indexOf("-") == -1)
                $("#Price").html(Price);

            if (IsControl != "-1") {
                if (IsControl == "0") {
                    $("#ControlText").html("Autonome");
                    $("#ControlValue").attr("checked", false);
                }
                else {
                    $("#ControlText").html("Contrôlé");
                    $("#ControlValue").attr("checked", true)
                }
            }

            if (isRun != "-1") {
                if (isRun == "1")
                    $("#Fuel").attr('src', "image/Online.png");
                else if (isRun == "0")
                    $("#Fuel").attr('src', "image/Fuel.png");
                else if (isRun == "3")
                    $("#Fuel").attr('src', "image/Fueling.gif");
            } else {
                $("#Fuel").attr('src', "image/offline.png");
            }
