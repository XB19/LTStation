# LTStation dans Docker : PostgreSQL (bases center et station) + serveur (site Center et logiciel Station).
#
#   docker compose up -d --build        puis http://localhost:8080 (Center) et http://localhost:8080/station/ (Station)
#
# Les identifiants viennent du fichier .env (jamais copié dans l'image). Au premier démarrage, les bases sont créées
# depuis database/docker/dumps/*.sql s'ils existent (copie des bases locales : python database/tools/docker_dump.py),
# sinon depuis les schémas vides de database/.
# Le matériel (ports série, lecteurs de cartes) n'est pas accessible depuis un conteneur : utiliser l'application
# de bureau (desktop/) sur le poste de la station.
name: ltstation

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      CENTER_DB: ${DB_NAME:-center}
      STATION_DB: ${STATION_DB_NAME:-station}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/schema:ro
      - ./database/docker/initdb.sh:/docker-entrypoint-initdb.d/10-ltstation.sh:ro
    ports:
      # Port différent du PostgreSQL déjà installé sur le poste
      - "${DOCKER_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: ltstation:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Dans le réseau Docker, la base est le service « db »
      DB_HOST: db
      DB_PORT: "5432"
      STATION_DB_HOST: db
      STATION_DB_PORT: "5432"
      TZ: ${TZ:-Africa/Lome}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - appdata:/app/data
      # Réglages locaux de la station (clés des cartes…), modèles RDLC, impressions et exports
      - ./backend/station:/app/data/station

volumes:
  pgdata:
  appdata:
