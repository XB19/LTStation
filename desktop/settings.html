<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>LTStation Station — Serveur</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; font-family: 'Segoe UI', system-ui, sans-serif;
           background: radial-gradient(circle at 20% 20%, #14b8a6 0%, #0f766e 35%, #0b2f2c 100%); }
    .box { background: #fff; border-radius: 18px; padding: 36px; width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    .logo { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #14b8a6, #0f766e); color: #fff;
            font-weight: 800; display: grid; place-items: center; font-size: 18px; }
    h1 { font-size: 22px; margin: 18px 0 6px; }
    p { color: #64748b; margin: 0 0 20px; }
    label { font-size: 14px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 12px 14px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 10px; }
    button { margin-top: 18px; width: 100%; padding: 14px; border: none; border-radius: 10px; background: #0f766e; color: #fff; font-size: 16px; cursor: pointer; }
    .err { background: #fee2e2; color: #b91c1c; padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">LT</div>
    <h1>Adresse du serveur</h1>
    <p>Indiquez l'adresse du serveur LTStation (le même que celui du Center).</p>
    <div class="err" id="err"></div>
    <label for="url">Adresse</label>
    <input id="url" placeholder="http://192.168.1.10:8080">
    <button id="save">Se connecter</button>
  </div>
  <script>
    const q = new URLSearchParams(location.search)
    const err = document.getElementById('err')
    const input = document.getElementById('url')
    input.value = q.get('url') || 'http://localhost:8080'
    if (q.get('error')) { err.textContent = q.get('error'); err.style.display = 'block' }
    document.getElementById('save').onclick = async () => {
      try { await window.ltDesktop.saveServer(input.value) } catch (e) { err.textContent = e.message.replace(/^.*Error: /, ''); err.style.display = 'block' }
    }
    input.onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('save').click() }
  </script>
</body>
</html>
