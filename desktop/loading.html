<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>LTStation Station</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff;
           background: radial-gradient(circle at 20% 20%, #14b8a6 0%, #0f766e 35%, #0b2f2c 100%); }
    .c { text-align: center; }
    .logo { width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 18px; background: #fff; color: #0f766e;
            font-weight: 800; display: grid; place-items: center; font-size: 24px; }
    .spin { width: 34px; height: 34px; margin: 22px auto 0; border: 4px solid rgba(255,255,255,.3); border-top-color: #fff;
            border-radius: 50%; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg) } }
  </style>
</head>
<body>
  <div class="c">
    <div class="logo">LT</div>
    <div id="t" style="font-size:18px"></div>
    <div class="spin"></div>
  </div>
  <script>document.getElementById('t').textContent = new URLSearchParams(location.search).get('text') || 'Chargement…'</script>
</body>
</html>
